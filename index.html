<style>

<script>
  const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEbM8YAc7jQes9oX6_-aVsVib2H40avHQkL6TkRRI2cYmw7nYG29F_1lGGz-2gL0nve4Q91MBM02Q-/pub?output=csv";
  
  let scheduleData = [];
  let bookmarks = JSON.parse(localStorage.getItem('koda_bookmarks') || '[]');
  
  let showBookmarksOnly = false;
  let searchQuery = '';

  const todayDateObj = new Date();
  todayDateObj.setHours(0, 0, 0, 0); 
  
  const currentYear = todayDateObj.getFullYear();
  const currentMonth = todayDateObj.getMonth() + 1;
  const currentDay = todayDateObj.getDate();

  let calYear = currentYear;
  let calMonth = currentMonth; 

  const holidays2026 = [
    "01-01", 
    "02-16", "02-17", "02-18", 
    "03-01", "03-02", 
    "05-05", 
    "05-24", "05-25", 
    "06-03", 
    "06-06", 
    "08-15", "08-17", 
    "09-24", "09-25", "09-26", 
    "10-03", "10-05", 
    "10-09", 
    "12-25"  
  ];

  function parseCSV(csv) {
    const rows = [];
    let row = [], curr = '';
    let insideQuote = false;
    
    for (let i = 0; i < csv.length; i++) {
      const char = csv[i];
      const nextChar = csv[i + 1];
      
      if (char === '"' && insideQuote && nextChar === '"') {
        curr += '"';
        i++; 
      } else if (char === '"') {
        insideQuote = !insideQuote;
      } else if (char === ',' && !insideQuote) {
        row.push(curr);
        curr = '';
      } else if ((char === '\n' || char === '\r') && !insideQuote) {
        if (char === '\r' && nextChar === '\n') i++; 
        row.push(curr);
        rows.push(row);
        row = [];
        curr = '';
      } else {
        curr += char;
      }
    }
    if (curr || row.length > 0) {
      row.push(curr);
      rows.push(row);
    }

    const dataArr = [];
    for(let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length < 3 || !r[0]) continue; 
      
      const dateStr = r[0].trim();
      let m = 1, d = 1;
      const match = dateStr.match(/(\d{1,2})\.(\d{1,2})/);
      let eventDateObj = new Date();
      if (match) {
        m = parseInt(match[1], 10);
        d = parseInt(match[2], 10);
        eventDateObj = new Date(currentYear, m - 1, d);
      }

      let ddayStr = "";
      if(match) {
          const diffTime = eventDateObj.getTime() - todayDateObj.getTime();
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
          
          if (diffDays === 0) {
              ddayStr = "D-day";
          } else if (diffDays > 0) {
              ddayStr = `D-${diffDays}`;
          } else {
              ddayStr = `D+${Math.abs(diffDays)}`;
          }
      }

      const id = `${dateStr}_${r[2] ? r[2].trim() : ''}`;

      dataArr.push({
        id: id,
        month: m,
        day: d,
        date: dateStr,
        location: r[1] ? r[1].trim() : "ㅡ",
        title: r[2] ? r[2].trim() : "ㅡ",
        attendees: r[3] ? r[3].trim() : "ㅡ",
        content: r[4] ? r[4].trim() : "ㅡ",
        host: r[5] ? r[5].trim() : "ㅡ",
        note: r[6] ? r[6].trim() : "ㅡ",
        dday: ddayStr 
      });
    }
    return dataArr;
  }

  window.toggleBookmark = function(event, id) {
    event.stopPropagation(); 
    if (bookmarks.includes(id)) {
      bookmarks = bookmarks.filter(item => item !== id);
    } else {
      bookmarks.push(id);
    }
    localStorage.setItem('koda_bookmarks', JSON.stringify(bookmarks));
    updateView();
  }
  
  window.shareEvent = function(event, globalIndex) {
      event.stopPropagation(); 
      
      const schedule = scheduleData[globalIndex];
      const shareTitle = `[KODA 일정] ${schedule.title}`;
      const shareText = `📅 일시: ${schedule.date}\n📍 장소: ${schedule.location}\n\n자세한 일정은 앱을 통해 확인하세요!`;
      const shareUrl = window.location.href; 

      if (navigator.share) {
          navigator.share({
              title: shareTitle,
              text: shareText,
              url: shareUrl,
          })
          .then(() => console.log('공유 성공'))
          .catch((error) => console.log('공유 실패', error));
      } else {
          alert("현재 브라우저에서는 공유 기능이 지원되지 않습니다.\n\n" + shareTitle + "\n" + shareText);
      }
  }

  let currentModalGlobalIndex = null;
  window.toggleBookmarkModal = function() {
    if (currentModalGlobalIndex === null) return;
    const event = scheduleData[currentModalGlobalIndex];
    if (bookmarks.includes(event.id)) {
      bookmarks = bookmarks.filter(item => item !== event.id);
    } else {
      bookmarks.push(event.id);
    }
    localStorage.setItem('koda_bookmarks', JSON.stringify(bookmarks));
    
    const modalStar = document.getElementById('modalStarBtn');
    if (bookmarks.includes(event.id)) {
      modalStar.classList.add('starred');
    } else {
      modalStar.classList.remove('starred');
    }
    updateView();
  }

  window.toggleBookmarksOnly = function() {
    showBookmarksOnly = !showBookmarksOnly;
    const btn = document.getElementById('bookmarkFilterBtn');
    if (showBookmarksOnly) {
      btn.classList.add('active-bookmark');
    } else {
      btn.classList.remove('active-bookmark');
    }
    updateView();
  }

  window.handleSearchInput = function(e) {
    searchQuery = e.target.value.trim().toLowerCase();
    updateView();
  }

  function getFilteredData() {
    let data = scheduleData;

    if (showBookmarksOnly) {
      data = data.filter(event => bookmarks.includes(event.id));
    }

    if (searchQuery !== '') {
      data = data.filter(event => 
        event.title.toLowerCase().includes(searchQuery) ||
        event.location.toLowerCase().includes(searchQuery) ||
        event.date.toLowerCase().includes(searchQuery) ||
        event.content.toLowerCase().includes(searchQuery) ||
        event.host.toLowerCase().includes(searchQuery)
      );
    }

    if (!showBookmarksOnly && searchQuery === '') {
      data = data.filter(event => event.month == calMonth);
    }

    return data;
  }

  async function manualRefresh() {
    scheduleContainer.innerHTML = `<div class="loading-msg">최신 일정을 새로고침 중입니다...⏳</div>`;
    await loadData();
  }

  async function loadData() {
    try {
      const response = await fetch(GOOGLE_SHEET_CSV_URL + "&t=" + new Date().getTime());
      const csvText = await response.text();
      scheduleData = parseCSV(csvText);
      updateView();
    } catch (error) {
      console.error("데이터 연동 실패:", error);
      scheduleContainer.innerHTML = `<div class="no-data">일정을 불러오지 못했습니다. 네트워크 상태를 확인해주세요.</div>`;
    }
  }

  function updateView() {
    renderCalendar();
    renderSchedules();
  }

  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const display = document.getElementById('calMonthDisplay');
    
    grid.style.animation = 'none';
    grid.offsetHeight; 
    grid.style.animation = 'fadeIn 0.3s ease-out';
    
    grid.innerHTML = '';
    display.innerText = `${calYear}년 ${calMonth}월`;

    const days = ['일', '월', '화', '수', '목', '금', '토'];
    days.forEach((day, index) => {
      let dayClass = "cal-day-name";
      if (index === 0) dayClass += " text-red";
      else if (index === 6) dayClass += " text-blue";
      grid.innerHTML += `<div class="${dayClass}">${day}</div>`;
    });

    const firstDayIndex = new Date(calYear, calMonth - 1, 1).getDay();
    const lastDay = new Date(calYear, calMonth, 0).getDate();

    for(let i = 0; i < firstDayIndex; i++) {
      grid.innerHTML += `<div class="cal-cell empty"></div>`;
    }

    for(let d = 1; d <= lastDay; d++) {
      let monthBaseData = scheduleData.filter(e => e.month === calMonth && e.day === d);
      if (showBookmarksOnly) {
        monthBaseData = monthBaseData.filter(e => bookmarks.includes(e.id));
      }

      let eventsHtml = '';
      monthBaseData.forEach(e => {
        const globalIndex = scheduleData.indexOf(e);
        const isChairman = e.note.includes("회장님 참석");
        
        let chipClass = "cal-event-chip";
        if (isChairman) chipClass += " chairman";

        const shortTitle = e.title.length > 7 ? e.title.substring(0, 7) + '..' : e.title;
        eventsHtml += `<div class="${chipClass}" onclick="openDayEventsModal(${calYear}, ${calMonth}, ${d}); event.stopPropagation();">${shortTitle}</div>`;
      });

      const isToday = (calYear === currentYear && calMonth === currentMonth && d === currentDay);
      const cellClass = isToday ? "cal-cell today" : "cal-cell";
      const todayBadge = isToday ? `<span class="today-badge">TODAY</span>` : "";

      const currentDayOfWeek = new Date(calYear, calMonth - 1, d).getDay();
      const mmdd = String(calMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      let dateNumClass = "cal-date-num";
      
      if (currentDayOfWeek === 0 || holidays2026.includes(mmdd)) {
        dateNumClass += " text-red";
      } else if (currentDayOfWeek === 6) {
        dateNumClass += " text-blue";
      }

      const dateClick = monthBaseData.length > 0
        ? `onclick="openDayEventsModal(${calYear}, ${calMonth}, ${d})"`
        : "";

      grid.innerHTML += `
        <div class="${cellClass}" ${dateClick} style="${monthBaseData.length > 0 ? 'cursor:pointer;' : ''}">
          <div class="${dateNumClass}">${d}${todayBadge}</div>
          ${eventsHtml}
        </div>
      `;
    }
  }

  window.changeMonth = function(offset) {
    calMonth += offset;
    if(calMonth > 12) { calMonth = 1; calYear++; }
    else if(calMonth < 1) { calMonth = 12; calYear--; }

    updateView();
  };

  function renderSchedules() {
    scheduleContainer.innerHTML = '';
    
    const currentFilteredData = getFilteredData();

    if (currentFilteredData.length === 0) {
      scheduleContainer.innerHTML = `<div class="no-data">등록된 일정이 없습니다.</div>`;
      return;
    }

    currentFilteredData.forEach(event => {
      const globalIndex = scheduleData.indexOf(event);
      const isChairman = event.note.includes("회장님 참석");
      const titleClass = isChairman ? "event-title chairman" : "event-title";
      const isStarred = bookmarks.includes(event.id);

      const card = document.createElement('div');
      card.className = 'event-card';

      // 공유 버튼: 네이버 뉴스에서 쓰는 공유(노드) 아이콘으로 대체, 별표 버튼과 같은 라인에 그룹핑
      card.innerHTML = `
        <div class="card-actions">
          <button class="icon-btn share-btn" onclick="shareEvent(event, ${globalIndex})">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M18,16.08c-0.76,0-1.44,0.3-1.96,0.77L8.91,12.7C8.96,12.47,9,12.24,9,12s-0.04-0.47-0.09-0.7l7.05-4.11 c0.54,0.5,1.25,0.81,2.04,0.81c1.66,0,3-1.34,3-3c0-1.66-1.34-3-3-3s-3,1.34-3,3c0,0.24,0.04,0.47,0.09,0.7L8.04,9.81 C7.5,9.31,6.79,9,6,9c-1.66,0-3,1.34-3,3s1.34,3,3,3c0.79,0,1.5-0.31,2.04-0.81l7.12,4.15c-0.05,0.21-0.08,0.43-0.08,0.66 c0,1.61,1.31,2.92,2.92,2.92c1.61,0,2.92-1.31,2.92-2.92C20.92,17.39,19.61,16.08,18,16.08z"></path>
            </svg>
          </button>
          <button class="icon-btn star-btn ${isStarred ? 'starred' : ''}" onclick="toggleBookmark(event, '${event.id}')">
            ${isStarred
              ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>'
            }
          </button>
        </div>
        <button class="event-header" onclick="openModal(${globalIndex})">
          <div class="event-meta">
            <div class="event-date">${event.date}</div>
            <div class="event-divider">/</div>
            <div class="event-location">${event.location}&nbsp;(${event.dday})</div>
          </div>
          <div class="${titleClass}">${event.title}</div>
        </button>
      `;
      scheduleContainer.appendChild(card);
    });
  }
  
  window.addEventListener('popstate', function(event) {
    document.getElementById('dayEventsModal').style.display = 'none';
    hideModalDOM();
  });

  // 날짜를 클릭하면 그 날짜의 일정들을 먼저 보여줍니다.
  // 일정이 1개면 바로 상세 화면, 2개 이상이면 선택 목록을 표시합니다.
  window.openDayEventsModal = function(year, month, day) {
    const dayEvents = scheduleData.filter(eventData =>
      Number(eventData.month) === Number(month) &&
      Number(eventData.day) === Number(day) &&
      (!showBookmarksOnly || bookmarks.includes(eventData.id))
    );

    if (dayEvents.length === 0) return;

    if (dayEvents.length === 1) {
      openModal(scheduleData.indexOf(dayEvents[0]));
      return;
    }

    document.getElementById('dayEventsTitle').innerText =
      `${year}년 ${month}월 ${day}일 일정`;
    document.getElementById('dayEventsSubtitle').innerText =
      `총 ${dayEvents.length}개의 일정이 있습니다. 확인할 일정을 선택하세요.`;

    const list = document.getElementById('dayEventList');
    list.innerHTML = '';

    dayEvents.forEach(eventData => {
      const index = scheduleData.indexOf(eventData);
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'day-event-item' +
        (eventData.note.includes("회장님 참석") ? ' chairman' : '');

      const title = document.createElement('div');
      title.className = 'day-event-item-title';
      title.innerText = eventData.title;

      const meta = document.createElement('div');
      meta.className = 'day-event-item-meta';
      meta.innerText = `${eventData.location} · ${eventData.dday}`;

      item.appendChild(title);
      item.appendChild(meta);

      item.onclick = function() {
        closeDayEventsModal(false);
        openModal(index);
      };

      list.appendChild(item);
    });

    document.getElementById('dayEventsModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    history.pushState({ dayEventsModalOpen: true }, "", "");
  };

  window.closeDayEventsModal = function(goBack = true) {
    document.getElementById('dayEventsModal').style.display = 'none';
    if (goBack) history.back();
  };

  window.closeDayEventsModalOnOutsideClick = function(e) {
    if (e.target.id === 'dayEventsModal') history.back();
  };

  window.openModal = function(globalIndex) {
    currentModalGlobalIndex = globalIndex;
    const event = scheduleData[globalIndex];
    const isChairman = event.note.includes("회장님 참석");
    
    const titleEl = document.getElementById('modalTitle');
    titleEl.innerText = isChairman ? `${event.title} *` : event.title;
    titleEl.className = isChairman ? "modal-title chairman" : "modal-title";

    const chairmanFootnote = document.getElementById('modalChairmanFootnote');
    chairmanFootnote.style.display = isChairman ? 'block' : 'none';

    document.getElementById('modalDate').innerText = event.date;
    document.getElementById('modalLocation').innerText = event.location;
    document.getElementById('modalAttendees').innerText = event.attendees;
    document.getElementById('modalContent').innerText = event.content;
    document.getElementById('modalHost').innerText = event.host;
    document.getElementById('modalNote').innerText = event.note;

    const modalStar = document.getElementById('modalStarBtn');
    if (bookmarks.includes(event.id)) {
      modalStar.innerText = '★';
      modalStar.classList.add('starred');
    } else {
      modalStar.innerText = '☆';
      modalStar.classList.remove('starred');
    }

    document.getElementById('eventModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';

    history.pushState({ modalOpen: true }, "", "");
  };

  function hideModalDOM() {
    document.getElementById('eventModal').style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  window.closeModalAction = function() {
    history.back(); 
  };

  window.closeModalOnOutsideClick = function(e) {
    if(e.target.id === 'eventModal') {
      history.back();
    }
  };

  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block'; 

    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none';
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        deferredPrompt = null;
      });
    });
  });

  const isIos = () => {
    const ua = window.navigator.userAgent.toLowerCase();
    return /iphone|ipad|ipod/.test(ua);
  };
  const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

  if (isIos() && !isInStandaloneMode()) {
    installBtn.style.display = 'inline-block';
    installBtn.addEventListener('click', () => {
      alert("아이폰 화면 맨 아래의 '공유(내보내기) [↑]' 버튼을 누른 후,\n'홈 화면에 추가 [+]'를 선택해주세요!");
    });
  }

  const calendarWrapper = document.getElementById('calendarWrapper');
  let startX = 0;
  let endX = 0;

  calendarWrapper.addEventListener('touchstart', (e) => {
    startX = e.changedTouches[0].screenX;
  }, {passive: true});

  calendarWrapper.addEventListener('touchend', (e) => {
    endX = e.changedTouches[0].screenX;
    handleSwipe();
  }, {passive: true});

  function handleSwipe() {
    const swipeThreshold = 50; 
    if (startX - endX > swipeThreshold) {
      changeMonth(1);
    } else if (endX - startX > swipeThreshold) {
      changeMonth(-1);
    }
  }

  loadData();

</script>
</body>
</html>
